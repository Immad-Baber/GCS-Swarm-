services:
  gcs-swarm:
    build: .
    container_name: gcs-swarm-system
    ports:
      - "5000:5000"
      - "14551:14560/udp"
    environment:
      - NUM_DRONES=5
    # All components (sim_vehicle.py / MAVProxy / telemetry server) run inside
    # this single container and communicate over 127.0.0.1. The GCS UI is
    # exposed on port 5000.
    restart: unless-stopped
